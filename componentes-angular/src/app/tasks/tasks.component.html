<section id="task">
  <header>
    <h2>Tareas de {{ nameTask }}</h2>
    <menu>
      <button>Agregar Tarea Nueva</button>
    </menu>
  </header>

  <ul>
    @for (task of taksUserSelected; track task.id) {
    <li>
      <app-task [task]="task" (finishedTask)="onFinishedTask($event)"></app-task>
    </li>
    }
  </ul>
</section>
