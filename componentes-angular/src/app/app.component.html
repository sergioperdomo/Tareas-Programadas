<app-header></app-header>
<main>
  <ul id="users">
    @for (iteratedUsers of users; track iteratedUsers.id) {
    <li>
      <app-users
        [users]="iteratedUsers"
        (userSelected)="selectedUserId($event)"
      ></app-users>
    </li>
    }
  </ul>
  @if (userIdSelected) {
    <app-tasks
      [nameTask]="userSelected.name"/>
  } @else {
    <p id="textoCondicional">Select a user to see their tasks.</p>
  }
</main>
